<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Widget</title>
<style>
:root{color-scheme:dark;--ink:#fff;--ink-soft:#c5c7cc;--accent:#ffb454;--on-accent:#2a1a04}
html,body{height:100%;margin:0;background:transparent;overflow:hidden}
body{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--ink);font-size:13px;user-select:none;-webkit-user-select:none;padding:16px;box-sizing:border-box}
.wg{height:100%;box-sizing:border-box;border-radius:24px;padding:16px;background:rgba(20,22,30,.62);border:1px solid rgba(255,255,255,.26);
  box-shadow:0 6px 14px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 24px rgba(255,255,255,.05);
  background-image:linear-gradient(155deg,rgba(255,255,255,.16),rgba(255,255,255,0) 35%);
  -webkit-app-region:drag;cursor:grab}
h3{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.num{font-variant-numeric:tabular-nums}
.w-time{font-size:40px;font-weight:700;line-height:1;letter-spacing:-.02em}
.w-date{font-size:13px;color:var(--ink-soft);margin-top:6px}
.meter{display:grid;grid-template-columns:34px 1fr 40px;align-items:center;gap:8px;font-size:12px;margin-top:8px}
.meter i{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
.meter i u{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .8s ease}
.meter em{font-style:normal;text-align:right;color:var(--ink-soft)}
.sub{font-size:11.5px;color:var(--ink-soft);margin-top:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11.5px;text-align:center}
.cal span{height:22px;display:grid;place-items:center;border-radius:50%}
.cal .hd{color:var(--ink-soft);font-weight:700}
.cal .today{background:var(--accent);color:var(--on-accent);font-weight:700}
</style>
</head>
<body>
<div class="wg" id="wg"></div>
<script src="widget.js"></script>
</body>
</html>
