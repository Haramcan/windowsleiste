name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Helfer bauen
        run: dotnet publish helper/InselHelper.csproj -c Release -o app/helper-bin

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: app
        run: npm ci

      - name: Versionsnummer setzen
        working-directory: app
        run: npm version 0.1.${{ github.run_number }} --no-git-tag-version

      - name: Installationsdatei bauen
        working-directory: app
        run: npm run dist

      - name: Helfer einzeln testen
        shell: bash
        run: |
          (sleep 6; echo '{"c":"notify","on":true}'; sleep 4) | app/helper-bin/InselHelper.exe 1 > helper-out.txt 2> helper-err.txt || true
          cut -c1-300 helper-out.txt | head -40
          cat helper-err.txt
          grep -q '"t":"hello"' helper-out.txt
          grep -q '"t":"windows"' helper-out.txt

      - name: Probelauf unter Windows
        working-directory: app
        shell: bash
        run: |
          mkdir -p shots
          INSEL_SHOT=shots INSEL_REAL=1 timeout 220 npx electron . || true
          sort shots/helper.log | uniq -c
          grep '^glas' shots/helper.log || true
          grep '^klick' shots/helper.log || true
          grep -q '^klick: normal: vorher=idle hover=hub klick=quick' shots/helper.log
          grep -q '^klick: nach Vollbild: vorher=idle hover=hub klick=quick' shots/helper.log
          grep -q '^klick: Windows-Taste im Vollbild: offen=start bleibt=start zweiter Druck=idle' shots/helper.log
          grep '^suche' shots/helper.log || true
          grep '^menü' shots/helper.log || true
          grep '^häufig' shots/helper.log || true
          grep -q '^häufig: ok' shots/helper.log
          grep -q '^menü: Task beenden: Editor beendet' shots/helper.log
          grep -q '^menü: Infobereich: links=Left danach=Left,Right' shots/helper.log
          grep 'traydiag' shots/helper.log || true
          grep -q '^menü: Öffnen mit: ok' shots/helper.log
          grep -q '^menü: Vorschau: 2 Fenster' shots/helper.log
          grep -q '^menü: App: .*Task beenden (erzwingen) | Task-Manager' shots/helper.log
          grep -q '^menü: Start: .*Geräte-Manager.*Task-Manager.*Ausführen' shots/helper.log
          grep -q '^menü: Insel: Task-Manager | Desktop anzeigen' shots/helper.log
          grep -q '^klick: Zurück ins Spiel: offen=start .*sofort versteckt=true' shots/helper.log
          grep -q '^klick: Automatisch ausblenden: versteckt=true Rand=sichtbar weg=versteckt' shots/helper.log
          grep -q '^suche: deinstallieren: .*Installierte Apps' shots/helper.log
          grep -q '^suche: programme hinzufügen: .*Installierte Apps' shots/helper.log
          grep -q '^glas: Standard: 0 von' shots/helper.log
          ls shots/idle.png shots/hub.png shots/music.png
          grep -q "helper: windows" shots/helper.log
          grep -q "helper: tray" shots/helper.log
          ls shots/widget-clock.png shots/widget-calendar.png shots/widget-system.png
          grep -q "helper: media" shots/helper.log || echo "::warning::Keine Musik-Daten im Probelauf"
          grep -q "helper: volume" shots/helper.log || echo "::warning::Keine Lautstaerke-Daten (Runner ohne Audiogeraet?)"
          if grep -q "helper: error" shots/helper.log; then echo "::warning::Helfer meldet Fehler"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Probelauf-Bilder
          path: app/shots

      - uses: actions/upload-artifact@v4
        with:
          name: Insel-Leiste-Setup
          path: app/dist/Insel-Leiste-Setup.exe
          if-no-files-found: error

      - name: Vorschau zum Herunterladen veröffentlichen
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vorschau --cleanup-tag --yes || true
          sleep 5
          ls app/dist/latest.yml
          gh release create vorschau app/dist/Insel-Leiste-Setup.exe app/dist/Insel-Leiste-Setup.exe.blockmap app/dist/latest.yml --prerelease --target "$GITHUB_SHA" \
            --title "Insel-Leiste Vorschau" \
            --notes "Aktueller Entwicklungsstand. Insel-Leiste-Setup.exe herunterladen und starten. Windows warnt, weil die Datei nicht signiert ist: Weitere Informationen > Trotzdem ausfuehren."
